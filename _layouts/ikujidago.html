---
layout: default
---

<style>
  .page-header .project-tagline {
    color: #684b32;
    opacity: 1;
  }

  .record-protection-artwork {
    max-width: 560px;
    margin: 1.5rem auto;
  }

  .record-protection-artwork img {
    display: block;
    width: 100%;
    height: auto;
  }

  .record-recovery-options {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 0.75rem;
    padding: 0;
    margin: 1.25rem 0 2rem;
    list-style: none;
  }

  .record-recovery-options li {
    display: flex;
    align-items: center;
    gap: 1rem;
    min-width: 0;
    padding: 1rem;
    border: 1px solid #e9e2da;
    border-radius: 12px;
  }

  .record-recovery-options img {
    flex: 0 0 auto;
    width: 88px;
    height: 76px;
    object-fit: contain;
  }

  .record-recovery-options p {
    margin: 0;
    font-size: 1rem;
    font-weight: 400;
  }

  @media (min-width: 42em) {
    .record-recovery-options {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .record-recovery-options li {
      flex-direction: column;
      text-align: center;
    }

    .record-recovery-options img {
      width: 132px;
      height: 112px;
    }
  }
</style>
